name: "wMBus MQTT Bridge"
description: "wM-Bus over MQTT (RAW HEX) + optional wired M-Bus -> wmbusmeters -> Home Assistant Discovery"
version: "1.5.56"
slug: "wmbus_mqtt_bridge"
stage: experimental
image: "ghcr.io/kustonium/{arch}-addon-wmbus_mqtt_bridge"
arch:
  - amd64
  - aarch64

init: false

ingress: true
ingress_port: 8099
hassio_api: true
# Wired M-Bus: grants the cgroup rules needed to OPEN serial devices
# (majors 204 ttyAMA, 188 ttyUSB, 166 ttyACM + the udev SERIAL subsystem).
# Visibility of /dev does not depend on this — Supervisor bind-mounts the whole
# host /dev into every add-on unconditionally — so the M-Bus tab detects a
# missing permission by trying to open the port the user picked, never by
# looking at whether the path exists.
uart: true
# Read-only access to the HA Core API, used ONLY by the opt-in entity
# verification (verify_ha_entities). When that option is false (default), the
# add-on does not call the Core API.
homeassistant_api: true
panel_icon: mdi:gauge
panel_title: "wMBus Bridge"
services:
  - mqtt:want

options:
  raw_topic: "wmbus/+/telegram"
  loglevel: "normal"
  filter_hex_only: true
  debug_every_n: 0

  search_mode: false
  search_expected_value_m3: 0
  search_tolerance_m3: 0.05
  search_delta_mode: false
  search_min_delta_m3: 0.001
  search_topic: "wmbus/search/candidates"

  discovery_enabled: true
  discovery_prefix: "homeassistant"
  discovery_retain: true

  state_prefix: "wmbusmeters"
  state_retain: false

  mqtt_mode: "auto"
  external_mqtt_host: ""
  external_mqtt_port: 1883
  external_mqtt_username: ""
  external_mqtt_password: ""

  # Opt-in: ask the HA Core API whether HA actually creates the add-on's
  # Discovery entities (via a hidden "canary" sensor wmbus_bridge_health).
  # Off by default. Read-only HA API access is declared statically; this option
  # only controls whether the API call is made. HA add-on mode only
  # (needs SUPERVISOR_TOKEN).
  verify_ha_entities: false

  # Opt-in read-only WebUI endpoint for exporting structured ESP RX evidence.
  # Disabled returns 404 and exposes nothing. The endpoint never returns RAW
  # telegrams, AES keys or MQTT credentials.
  esp_rx_api_enabled: false

  # Qundis (QDS/LSE) manufacturer walk-by block (0DFF5F). Off by default: it
  # only affects meters that emit that block, and it inserts a rewriting stage
  # ahead of the decoder. With it off the decode path is byte-for-byte what it
  # was. On, it (a) neutralises walk-by records the decoder cannot validate, so
  # upstream's single-byte gate cannot publish ciphertext as a reading, and
  # (b) decrypts the 2026-generation encrypted block when the meter's ordinary
  # AES key is configured. See docs/ARCHITECTURE.md.
  qds_walkby_enabled: false

  # ── Wired M-Bus (separate engine, off by default) ──────────
  # Two independent gates: mbus_tab_visible only shows the tab, mbus_enabled
  # actually starts the third wmbusmeters instance. Both off means the add-on
  # behaves exactly as before.
  mbus_tab_visible: false
  mbus_enabled: false
  mbus_device: ""
  # Serial number of the device the user picked, stored so a /dev node reused
  # by different hardware is detected instead of silently polled.
  mbus_device_serial: ""
  mbus_bus_alias: "MAIN"
  mbus_baudrate: "2400"
  # Fallback written into every meter file that has no own interval.
  # NOT passed to the decoder: pollinterval is not a wmbusmeters.conf key and
  # --pollinterval cannot be combined with --useconfig.
  mbus_poll_interval: "15m"
  mbus_donotprobe_all: true
  mbus_loglevel: "normal"
  mbus_logtelegrams: false
  mbus_ignoreduplicates: false
  mbus_meters: []

  meters: []

schema:
  raw_topic: str
  loglevel: list(normal|verbose|debug)
  filter_hex_only: bool
  debug_every_n: int
  search_mode: bool
  search_expected_value_m3: float
  search_tolerance_m3: float
  search_delta_mode: bool
  search_min_delta_m3: float
  search_topic: str
  discovery_enabled: bool
  discovery_prefix: str
  discovery_retain: bool
  state_prefix: str
  state_retain: bool
  mqtt_mode: list(auto|ha|external)
  external_mqtt_host: str?
  external_mqtt_port: int
  external_mqtt_username: str?
  external_mqtt_password: str?
  verify_ha_entities: bool
  esp_rx_api_enabled: bool
  qds_walkby_enabled: bool
  mbus_tab_visible: bool
  mbus_enabled: bool
  mbus_device: str?
  mbus_device_serial: str?
  mbus_bus_alias: str
  mbus_baudrate: list(300|600|1200|2400|4800|9600)
  mbus_poll_interval: str
  mbus_donotprobe_all: bool
  mbus_loglevel: list(normal|verbose|debug)
  mbus_logtelegrams: bool
  mbus_ignoreduplicates: bool
  mbus_meters:
    - id: str
      # Primary address p1..p250, or an 8-hex secondary address. Free string
      # for the same reason as `type` below: the bridge validates it and a
      # fixed enum here would make Supervisor reject saves it should accept.
      address: str
      type: str
      type_other: str?
      key: str?
      poll_interval: str?
      calculated_fields: str?
      static_fields: str?
  meters:
    - id: str
      meter_id: str
      # Free string: wmbusmeters validates the driver at decode time and its
      # driver set changes between versions. A fixed enum here goes stale (e.g.
      # 'izarv2' was missing), and Supervisor then rejects valid meters with
      # HTTP 400 on save. 'auto' and 'other' (+ type_other) still work.
      type: str
      type_other: str?
      key: str?
      # Glob patterns for decoded fields that should get no Home Assistant
      # entity, separated by commas or spaces (e.g.
      # "consumption_at_history_*, history_*_date"). Empty publishes every
      # field, which is the behaviour of every version before this option.
      exclude_fields: str?
      # Extra fields wmbusmeters computes from the telegram, semicolon
      # separated, each "name=formula" (e.g.
      # "difftemp_c=flow_temperature_c-return_temperature_c"). The decoder owns
      # the arithmetic — see its calculate_ documentation — and the result is a
      # normal field in the JSON, so it becomes a Home Assistant entity like
      # any other. Semicolons separate entries because a formula contains both
      # spaces and commas.
      calculated_fields: str?
      # Constant fields attached to this meter, semicolon separated, each
      # "name=value" (e.g. "location=kitchen; apartment=12"). The decoder copies
      # them into the JSON as they are — always as strings, so `apartment=12`
      # arrives as "12" — which makes them diagnostic entities and attributes
      # on every entity of that meter.
      static_fields: str?
