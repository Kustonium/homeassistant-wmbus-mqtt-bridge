services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  wmbus:
    image: ghcr.io/kustonium/wmbus_mqtt_bridge-dev:dev
    container_name: wmbus
    entrypoint: ["/usr/bin/docker-entrypoint.sh"]
    depends_on:
      - mosquitto
    ports:
      - "8099:8099"
    volumes:
      - ./config:/config
    # Wired M-Bus only: map YOUR converter, by its stable by-id path.
    # Never "/dev:/dev" and never privileged — on a typical home server one of
    # those ports is a Zigbee coordinator, and the M-Bus engine transmits.
    # devices:
    #   - "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A50285BI-if00-port0:/dev/ttyUSB0"
    restart: unless-stopped
