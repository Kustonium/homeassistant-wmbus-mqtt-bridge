name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu image, so the
      # apt-get that used to live here installed nothing ("already the newest
      # version") and only added a network dependency. On 2026-08-19 apt hung
      # and three runs sat in that step for 15 minutes without checking a single
      # script. Report the version instead, so a runner image that ever drops the
      # tool fails loudly here rather than silently skipping the linter.
      - name: Show ShellCheck version
        run: shellcheck --version

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(find . -type f -name '*.sh' \
            -not -path './.git/*' \
            -not -path './.claude/*' \
            -not -path './docker/config/*' \
            -not -path './wmbusmeters-mqtt-stdin/*' \
            | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi

          printf 'Checking shell scripts:\n'
          printf ' - %s\n' "${files[@]}"

          shellcheck \
            -s bash \
            -S warning \
            -x \
            "${files[@]}"